name: Daily video

on:
  schedule:
    # Evening IST publishing window (IST = UTC+5:30). GitHub scheduled runs are
    # best-effort and frequently dropped, so we give the evening several
    # uncongested fire-times; the pipeline's --scheduled guard ensures only ONE
    # video is produced per day no matter how many fire.
    - cron: "53 10 * * *"  # 16:23 IST
    - cron: "11 12 * * *"  # 17:41 IST
    - cron: "17 13 * * *"  # 18:47 IST
    - cron: "33 14 * * *"  # 20:03 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload)"
        type: boolean
        default: false

permissions:
  contents: write # commit state/history.json back

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GitHub forces Node 24 for JS actions from 2026-06-16; opt in now
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.pipeline --dry-run
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.pipeline --scheduled
          else
            python -m src.pipeline
          fi

      - name: Upload artifacts (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/final.mp4
            out/**/script.json
          if-no-files-found: ignore
          retention-days: 3  # debug copy; auto-deletes (video already lives on YouTube)

      - name: Commit history
        if: success()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@github.com"
          # persist all state the pipeline updates (dedupe history, perf stats,
          # IG token refresh stamp); skip if nothing changed
          git add state/history.json state/performance.json state/ig_token_refreshed.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: record published video"
          # remote may have moved during the long run — rebase then push, retry a few times
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep 5
          done
          echo "could not push history after retries" >&2; exit 1
